name: My first pipeline on github ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5      # clones your repo into the runner
      - uses: actions/setup-node@v5    # installs Node
        with:
          node-version: 24
      - run: npm ci                    # install deps
      - run: npm test                  # run tests