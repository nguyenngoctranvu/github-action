name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger for deploy

permissions:
  contents: read

jobs:
  test:
    # runs on push AND on manual dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    # manual only: skipped on push, runs on workflow_dispatch
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test                    # still gated on tests passing
    runs-on: ubuntu-latest
    # environment: production        # add required reviewers here for approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: echo "Deploying to production"