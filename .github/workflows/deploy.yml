name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Require green CI on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list \
            --workflow=CI --branch=main \
            --commit=${{ github.sha }} \
            --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "CI not green for $GITHUB_SHA (got: $conclusion)"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: echo "Deploying"