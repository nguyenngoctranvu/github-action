name: CI/CD with Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build once — produce dist/, hand it off as an artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build            # produces ./dist

      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # 2. Test the SAME build output, plus publish a report
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist/                 # reuse build output, don't rebuild

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}       # upload report even if tests fail
        with:
          name: test-report
          path: |
            coverage/
            test-results/**/*.xml
          if-no-files-found: warn

  # 3. Deploy the exact tested bytes
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist/

      - run: |
          ls -R dist
          echo "Deploying the exact artifact that was built and tested"